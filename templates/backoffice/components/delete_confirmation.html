<div class="tb-delete-overlay" id="globalDeleteOverlay" hidden>
  <div class="tb-delete-modal" role="dialog" aria-modal="true" aria-labelledby="globalDeleteTitle">
    <button type="button" class="tb-delete-close" data-close-global-delete aria-label="Close">×</button>
    <div class="tb-delete-title-row">
      <div class="tb-delete-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M7 7l1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg>
      </div>
      <div>
        <h2 id="globalDeleteTitle">Delete Record</h2>
        <p id="globalDeleteQuestion">Are you sure you want to delete this record?</p>
      </div>
    </div>
    <div class="tb-delete-preview" id="globalDeletePreview" hidden></div>
    <div class="tb-delete-danger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg>
      <div>
        <strong>This action cannot be undone.</strong>
        <p id="globalDeleteWarning">Eligible records will be permanently removed.</p>
      </div>
    </div>
    <div class="tb-delete-info" id="globalDeleteDetail">Review the item carefully before confirming.</div>
    <div class="tb-delete-actions">
      <button class="btn" type="button" data-close-global-delete>Cancel</button>
      <button class="btn tb-delete-confirm" type="button" id="globalDeleteConfirm">Delete Record</button>
    </div>
  </div>
</div>
