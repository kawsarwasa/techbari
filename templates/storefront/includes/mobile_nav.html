{% load static %}
<nav class="category-nav">
  <div class="container">
    <div class="category-menu-shell" data-category-menu>
      <button class="all category-menu-trigger" type="button" aria-expanded="false" aria-controls="storeCategoryMenu" data-category-menu-trigger>
        <i data-icon="menu"></i>
        <span>All Categories</span>
        <span class="category-menu-caret" aria-hidden="true">⌄</span>
      </button>
      <div class="category-menu-panel" id="storeCategoryMenu" data-category-menu-panel hidden>
        <a class="category-menu-row category-menu-row-all" href="{% url 'storefront:products' %}">
          <span class="category-menu-grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="category-menu-label">All Products</span>
          <span class="category-menu-chevron" aria-hidden="true">›</span>
        </a>
        <div class="category-menu-list">
          {% for category in categories %}
            <a class="category-menu-row" href="{% url 'storefront:products' %}?category={{ category.name|urlencode }}">
              <span class="category-menu-thumb" aria-hidden="true"><img src="{{ category.image_url }}" alt=""></span>
              <span class="category-menu-label">{{ category.name }}</span>
              <span class="category-menu-chevron" aria-hidden="true">›</span>
            </a>
          {% empty %}
            <div class="category-menu-empty">No categories are available right now.</div>
          {% endfor %}
        </div>
        <a class="category-menu-row category-menu-footer" href="{% url 'storefront:products' %}">
          <span class="category-menu-bag" aria-hidden="true"></span>
          <span class="category-menu-label">View All Products</span>
          <span class="category-menu-chevron" aria-hidden="true">›</span>
        </a>
      </div>
    </div>

    <div class="category-quick-scroll" aria-label="Popular categories">
      {% for category in category_menu|slice:':7' %}
        <a class="category-quick-link" href="{% url 'storefront:products' %}?category={{ category.name|urlencode }}">{{ category.name }}</a>
      {% endfor %}
      <a class="deal" href="{% url 'storefront:products' %}">% Deals</a>
    </div>
  </div>
</nav>
