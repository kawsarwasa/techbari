name: v3.0.0 Final Production QA

on:
  push:
    branches:
      - v3.0.0-final-production
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: techbari_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: github-actions-v300-development-test-secret
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DB_NAME: techbari_test
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      STAFF_AUTH_ENABLED: "1"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Collect static
        run: python manage.py collectstatic --noinput --clear
      - name: Production deploy check
        env:
          DJANGO_SECRET_KEY: github-actions-v300-production-secret-key-please-never-use-this-real-value
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: shop.example.test
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "3600"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          INTEGRATION_REQUIRE_HTTPS: "1"
          COURIER_WEBHOOK_REQUIRE_TIMESTAMP: "1"
        run: python manage.py check --deploy --fail-level ERROR
      - name: Production preflight
        env:
          DJANGO_SECRET_KEY: github-actions-v300-production-secret-key-please-never-use-this-real-value
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: shop.example.test
          SECURE_SSL_REDIRECT: "1"
          SECURE_HSTS_SECONDS: "3600"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          INTEGRATION_REQUIRE_HTTPS: "1"
          COURIER_WEBHOOK_REQUIRE_TIMESTAMP: "1"
        run: python manage.py production_preflight
      - name: Dedicated v3 security tests
        run: python manage.py test ops integrations staff_access customer_accounts store_settings -v 1
      - name: Full regression
        run: python manage.py test catalog inventory serial_tracking purchasing customers sales payments shipping returns accounting expenses reports promotions storefront store_settings customer_accounts staff_access backoffice.test_dashboard_analytics integrations ops -v 1
