name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: techbari
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "techbari-ci-development-secret-key"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_NAME: "techbari"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      STAFF_AUTH_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Production security settings check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-production-check-only-long-secret-key-1234567890"
          DJANGO_ALLOWED_HOSTS: "example.com"
          SECURE_SSL_REDIRECT: "1"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_HSTS_SECONDS: "3600"
          INTEGRATION_REQUIRE_HTTPS: "1"
          COURIER_WEBHOOK_REQUIRE_TIMESTAMP: "1"
          STAFF_MFA_REQUIRED: "1"
          STAFF_MFA_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
        run: python manage.py check --deploy

      - name: Check migration drift
        run: python manage.py makemigrations --check

      - name: Run full test suite
        run: python manage.py test
