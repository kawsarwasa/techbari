name: CRM Sales QA v1.5.0

on:
  push:
    branches: [v1.5.0-customer-sales]

jobs:
  crm-sales-qa:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: techbari
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_NAME: techbari
      DB_USER: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DJANGO_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Full regression tests
        run: python manage.py test catalog inventory serial_tracking purchasing customers sales -v 2
      - name: Verify CRM Sales migration state
        run: python manage.py showmigrations customers sales
